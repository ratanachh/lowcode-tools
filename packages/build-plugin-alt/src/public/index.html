<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>LowCode Engine Demo</title>
    <link rel="icon" href="http://lowcode-engine.cn/public/favicon.svg">
    <link href="/css/index.css" rel="stylesheet" />
    <!-- next.min.css must be loaded after index.css -->
    <link href="https://g.alicdn.com/code/lib/alifd__next/1.23.24/next.min.css" rel="stylesheet" />
    <!-- LowCode Engine page theme styles; can be swapped for theme-lowcode-dark -->
    <link rel="stylesheet" href="https://alifd.alicdn.com/npm/@alifd/theme-lowcode-light/0.2.0/next.min.css" />
    <!-- LowCode Engine page framework styles -->
    <link rel="stylesheet" href="https://uipaas-assets.com/prod/npm/@rchh/lowcode-engine/1.1.7-beta.11/dist/css/engine-core.css" />
    <!-- Styles for the official LowCode Engine extensions -->
    <link rel="stylesheet" href="https://uipaas-assets.com/prod/npm/@rchh/lowcode-engine-ext/1.0.6-beta.25/dist/css/engine-ext.css" />

    <!-- React; can be swapped for the production bundle -->
    <script src="https://g.alicdn.com/code/lib/react/16.13.1/umd/react.development.js"></script>
    <!-- React DOM; can be swapped for the production bundle -->
    <script src="https://g.alicdn.com/code/lib/react-dom/16.13.1/umd/react-dom.development.js"></script>
    <!-- React backward compatibility, for materials that depend on older APIs -->
    <script src="https://g.alicdn.com/code/lib/prop-types/15.7.2/prop-types.js"></script>
    <script src="https://g.alicdn.com/platform/c/react15-polyfill/0.0.1/dist/index.js"></script>
    <!-- lodash, a dependency of the lowcode editor -->
    <script src="https://g.alicdn.com/platform/c/lodash/4.6.1/lodash.min.js"></script>
    <!-- Date library, a dependency of Fusion Next -->
    <script src="https://g.alicdn.com/mylib/moment/2.24.0/min/moment.min.js"></script>
    <!-- Fusion Next main bundle, a dependency of the lowcode editor -->
    <script src="https://g.alicdn.com/code/lib/alifd__next/1.23.24/next.min.js"></script>
    <!-- LowCode Engine main bundle -->
    <script crossorigin="anonymous" src="https://uipaas-assets.com/prod/npm/@rchh/lowcode-engine/1.1.7-beta.11/dist/js/engine-core.js"></script>
    <!-- Main bundle for the official LowCode Engine extensions -->
    <script crossorigin="anonymous" src="https://uipaas-assets.com/prod/npm/@rchh/lowcode-engine-ext/1.0.6-beta.25/dist/js/engine-ext.js"></script>
  </head>

  <body>
    <div id="lce-container"></div>
    <script type="text/javascript" src="/js/index.js"></script>
  </body>
</html>
